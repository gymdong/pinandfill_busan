name: AI review

# PR 이 열리거나 갱신되면 Claude Haiku 가 diff 를 보고 참고용 코멘트를 남긴다(같은 코멘트를 갱신).
# 필요: repository secret ANTHROPIC_API_KEY. 없거나 포크/draft PR 이면 건너뛴다. 승인 대체가 아니라 참고용이다.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "present=$([ -n "$ANTHROPIC_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'true'
        run: scripts/ci/ai_review.sh > review.md
      - if: steps.key.outputs.present == 'true'
        run: gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file review.md

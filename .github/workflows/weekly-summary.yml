name: Weekly summary

# 매주 월요일 오전 9시(KST = 월요일 00:00 UTC)에 PR 현황을 Discord 로 보낸다.
# 필요: repository secret DISCORD_WEBHOOK_URL (채널 설정 → 연동 → 웹후크). 없으면 건너뛴다.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  summary:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Build summary
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "DISCORD_WEBHOOK_URL 없음, 건너뜀"; exit 0; fi
          scripts/ci/weekly_summary.sh > summary.txt
          cat summary.txt
      # Discord 는 메시지 1개가 2000자 제한이라 줄 단위로 1900자씩 나눠 보낸다.
      - name: Send to Discord
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          awk 'BEGIN{n=0; len=0} { if (len + length($0) + 1 > 1900) { n++; len=0 } print > sprintf("chunk_%02d.txt", n); len += length($0) + 1 }' summary.txt
          for f in chunk_*.txt; do
            jq -n --rawfile content "$f" '{content: $content}' \
              | curl -sS --fail-with-body -X POST -H 'Content-type: application/json' --data @- "$DISCORD_WEBHOOK_URL"
            sleep 1
          done
